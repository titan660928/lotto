<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大樂透選號程式</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            min-height: 100vh;
        }

        .ball {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.125rem;
            color: white;
            box-shadow: inset -2px -2px 6px rgba(0,0,0,0.2), 2px 2px 5px rgba(0,0,0,0.1);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        
        .ball:hover {
            transform: scale(1.1);
        }

        /* 根據數字區間給予不同顏色的彩球 */
        .ball-yellow { background: radial-gradient(circle at 30% 30%, #ffd54f, #ffb300); }
        .ball-blue { background: radial-gradient(circle at 30% 30%, #64b5f6, #1e88e5); }
        .ball-red { background: radial-gradient(circle at 30% 30%, #e57373, #e53935); }
        .ball-green { background: radial-gradient(circle at 30% 30%, #81c784, #43a047); }
        .ball-purple { background: radial-gradient(circle at 30% 30%, #ba68c8, #8e24aa); }
        
        .result-card {
            animation: slideUp 0.5s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body class="p-6 md:p-12 text-gray-800">

    <div class="max-w-4xl mx-auto">
        <header class="text-center mb-10">
            <h1 class="text-4xl md:text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-red-600 to-yellow-500 mb-4 drop-shadow-sm">
                大樂透幸運選號機
            </h1>
            <p class="text-gray-600">透過統計學常態分佈過濾，為您產生最佳組合</p>
        </header>

        <main class="grid md:grid-cols-3 gap-8">
            <!-- 左側控制面板 -->
            <div class="bg-white rounded-2xl shadow-xl p-6 md:col-span-1 h-fit border border-gray-100">
                <h2 class="text-xl font-bold mb-6 text-gray-700 flex items-center border-b pb-3">
                    <svg class="w-6 h-6 mr-2 text-yellow-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
                    選號設定
                </h2>
                
                <div class="mb-8">
                    <label class="block text-sm font-medium text-gray-700 mb-2">產生組數</label>
                    <select id="numSets" class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-red-500 focus:border-red-500 block p-2.5 outline-none transition-colors">
                        <option value="1">1 組</option>
                        <option value="2">2 組</option>
                        <option value="3">3 組</option>
                        <option value="4" selected>4 組</option>
                        <option value="5">5 組</option>
                        <option value="10">10 組</option>
                    </select>
                </div>

                <div class="mb-6 p-4 bg-red-50 rounded-lg text-sm text-red-800 leading-relaxed border border-red-100">
                    <p class="font-bold mb-1">過濾策略啟用中：</p>
                    <ul class="list-disc pl-5 space-y-1">
                        <li>總和落點限制 (115-185)</li>
                        <li>奇偶數平衡配置</li>
                        <li>大小號碼區間平衡</li>
                    </ul>
                </div>

                <button onclick="generateNumbers()" class="w-full text-white bg-gradient-to-r from-red-500 to-red-600 hover:from-red-600 hover:to-red-700 focus:ring-4 focus:outline-none focus:ring-red-300 font-bold rounded-lg text-lg px-5 py-3.5 text-center transition-all shadow-lg transform hover:-translate-y-0.5">
                    產生幸運號碼
                </button>
            </div>

            <!-- 右側結果展示區 -->
            <div class="md:col-span-2">
                <div id="resultsContainer" class="space-y-4">
                    <!-- 產生的結果會插入這裡 -->
                    <div class="flex items-center justify-center h-64 bg-white/50 rounded-2xl border-2 border-dashed border-gray-300 text-gray-400">
                        點擊左側按鈕開始產生選號
                    </div>
                </div>
            </div>
        </main>
        
        <footer class="text-center mt-12 text-sm text-gray-500">
            <p>※ 選號結果僅供娛樂與參考，不保證中獎。您可以將結果保存在名為 <span class="font-bold text-gray-700">其他</span> 的檔案中備查。</p>
        </footer>
    </div>

    <script>
        // 取得彩球顏色
        function getBallColorClass(num) {
            if (num <= 9) return 'ball-yellow';
            if (num <= 19) return 'ball-blue';
            if (num <= 29) return 'ball-red';
            if (num <= 39) return 'ball-green';
            return 'ball-purple';
        }

        // 檢查號碼組合是否符合統計分佈
        function isGoodCombination(numbers) {
            // 條件 1：總和落點 (115 到 185)
            const sum = numbers.reduce((a, b) => a + b, 0);
            if (sum < 115 || sum > 185) return false;

            // 條件 2：奇偶比例 (2, 3, 或 4 個奇數)
            const oddCount = numbers.filter(n => n % 2 !== 0).length;
            if (oddCount < 2 || oddCount > 4) return false;

            // 條件 3：大小區間平衡 (大於等於25的數量為 2, 3, 或 4 個)
            const highCount = numbers.filter(n => n >= 25).length;
            if (highCount < 2 || highCount > 4) return false;

            return true;
        }

        // 產生不重複的隨機號碼
        function getRandomNumbers(count, pool) {
            const shuffled = [...pool].sort(() => 0.5 - Math.random());
            return shuffled.slice(0, count);
        }

        // 產生號碼主邏輯
        function generateSmartLotto(numSets) {
            const results = [];
            const allNumbers = Array.from({length: 49}, (_, i) => i + 1);

            while (results.length < numSets) {
                // 從 1-49 隨機選出 6 個
                const picks = getRandomNumbers(6, allNumbers);
                picks.sort((a, b) => a - b);
                
                // 檢查是否符合過濾條件
                if (isGoodCombination(picks)) {
                    results.push(picks);
                }
            }
            return results;
        }

        // 點擊按鈕執行
        function generateNumbers() {
            const numSets = parseInt(document.getElementById('numSets').value);
            const container = document.getElementById('resultsContainer');
            
            // 清空容器
            container.innerHTML = '';
            
            // 產生號碼
            const lottoResults = generateSmartLotto(numSets);
            
            // 渲染畫面
            lottoResults.forEach((nums, index) => {
                const totalSum = nums.reduce((a, b) => a + b, 0);
                
                // 建立卡片
                const card = document.createElement('div');
                card.className = 'bg-white rounded-2xl shadow-md p-5 border border-gray-100 flex flex-col sm:flex-row sm:items-center justify-between result-card';
                card.style.animationDelay = `${index * 0.1}s`;
                
                // 左側標籤與總和
                const infoDiv = document.createElement('div');
                infoDiv.className = 'mb-4 sm:mb-0 text-center sm:text-left';
                infoDiv.innerHTML = `
                    <div class="text-sm font-bold text-gray-500 mb-1">第 ${index + 1} 組</div>
                    <div class="text-xs text-gray-400 bg-gray-50 inline-block px-2 py-1 rounded">總和: ${totalSum}</div>
                `;
                
                // 右側彩球區
                const ballsDiv = document.createElement('div');
                ballsDiv.className = 'flex gap-2 justify-center sm:justify-end flex-wrap';
                
                nums.forEach(num => {
                    const formattedNum = num.toString().padStart(2, '0');
                    const colorClass = getBallColorClass(num);
                    const ball = document.createElement('div');
                    ball.className = `ball ${colorClass}`;
                    ball.textContent = formattedNum;
                    ballsDiv.appendChild(ball);
                });
                
                card.appendChild(infoDiv);
                card.appendChild(ballsDiv);
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
